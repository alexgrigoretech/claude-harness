# Codex CLI config template. Copy to ~/.codex/config.toml (never copy auth.json).
# install.py rewrites the model and model_reasoning_effort lines from the machine json on every install.
# Every other line (trust entries, approvals, and the Windows block) is per machine and left alone.
# Exec and resume commands pass the model flag as well, so this file decides only for a bare codex call.
# The default is gpt-6.1-sol with gpt-6-astra reserved for escalation after two failed resumes.

model = "gpt-6.1-sol"
model_reasoning_effort = "high"
approvals_reviewer = "auto_review"

# Windows only:
# [windows]
# sandbox = "unelevated"

# One trusted block per working folder, for example:
# [projects."/Users/<you>/dev"]
# trust_level = "trusted"
