<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- One page A4 PR brief. Fill every placeholder comment, keep the structure, render with tools/render_design.py --pdf. -->
<title>PR brief</title>
<!-- Set the title to "PR brief <repo> <number>" once the number exists; comments inside the title element are not comments, the browser reads them as text. -->
<style>
  @page { size: A4; margin: 14mm 14mm 12mm 14mm; }
  :root {
    --ink: #1c1a17; --muted: #5d5853; --rule: #d9d3c9; --paper: #ffffff; --panel: #faf8f4;
    --accent: #0f5c4f; --accent-soft: #e4efec; --warn: #9a4a0e; --warn-soft: #f7e9dc; --bad: #9b2c2c; --bad-soft: #f6e3e3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 10.5pt/1.45 "Source Serif 4", "Charter", Georgia, serif; }
  h1, h2, h3, .label, .num, th, svg text { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--ink); padding-bottom: 6pt; margin-bottom: 12pt; }
  header h1 { font-size: 20pt; margin: 0; letter-spacing: -0.01em; }
  header .meta { text-align: right; color: var(--muted); font-size: 9pt; line-height: 1.3; }
  h2 { font-size: 11pt; margin: 0 0 4pt; color: var(--accent); }
  p { margin: 0 0 6pt; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14pt 18pt; }
  .span { grid-column: 1 / -1; }
  .card { border-top: 1px solid var(--rule); padding-top: 6pt; }
  ul { margin: 0; padding-left: 14pt; }
  li { margin-bottom: 3pt; }
  .progress { display: grid; grid-template-columns: 1fr 1fr; gap: 10pt; }
  .meter { background: var(--accent-soft); border-radius: 3px; height: 10pt; position: relative; overflow: hidden; margin: 4pt 0 2pt; }
  .meter > span { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
  .num { font-variant-numeric: tabular-nums; font-size: 20pt; font-weight: 600; line-height: 1; }
  .small { color: var(--muted); font-size: 9pt; }
  .know { background: var(--warn-soft); border-left: 3px solid var(--warn); padding: 6pt 8pt; }
  .know h2 { color: var(--warn); }
  svg text { font-size: 8pt; fill: var(--ink); }
  svg .mono { font-family: "IBM Plex Mono", "Consolas", monospace; }
  svg .box { fill: var(--panel); stroke: var(--rule); }
  svg .new { fill: var(--accent-soft); stroke: var(--accent); }
  svg .bad { fill: var(--bad-soft); stroke: var(--bad); }
  svg .arrow { stroke: var(--accent); stroke-width: 1.2; fill: none; marker-end: url(#head); }
  svg .cap { font-size: 8pt; fill: var(--muted); }
  table { border-collapse: collapse; width: 100%; font-size: 9pt; }
  td, th { text-align: left; padding: 2pt 6pt 2pt 0; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--rule); }
  td.n { font-variant-numeric: tabular-nums; text-align: right; padding-right: 10pt; }
</style>
</head>
<body>
<header>
  <h1><!-- PR #n: what this PR does for the reader, in one line --></h1>
  <div class="meta"><!-- repository, branch, state --><br><!-- n commits, n files, n tests --></div>
</header>

<div class="grid">
  <section class="card">
    <h2>What was achieved</h2>
    <p><!-- Two or three sentences: the change in the reader's words, with the one file name they must know in bold. --></p>
    <p><!-- One or two sentences: what it changes about the way we work. --></p>
  </section>

  <section class="card">
    <h2>How it works</h2>
    <svg viewBox="0 0 330 150" width="100%" aria-label="<!-- one line describing the diagram -->">
      <defs><marker id="head" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#0f5c4f"/></marker></defs>
      <!-- Boxes and arrows, at most eight boxes. Inputs on the left, the change in the middle with class new, outcomes on the right. -->
      <rect x="4" y="8" width="100" height="36" class="box"/>
      <text x="12" y="22" class="mono"><!-- input --></text>
      <text x="12" y="36" class="cap"><!-- what it carries --></text>
      <path d="M104,26 L132,60" class="arrow"/>
      <rect x="134" y="44" width="90" height="56" class="new"/>
      <text x="142" y="60" class="mono"><!-- the change --></text>
      <text x="142" y="74" class="cap"><!-- one line --></text>
      <text x="142" y="88" class="cap"><!-- one line --></text>
      <path d="M224,72 L252,72" class="arrow"/>
      <rect x="254" y="58" width="72" height="26" class="box"/>
      <text x="260" y="69"><!-- outcome --></text><text x="260" y="80" class="cap"><!-- detail --></text>
    </svg>
    <p class="small"><!-- Optional caption, one sentence. Delete the paragraph when the diagram needs none. --></p>
  </section>

  <section class="card span know">
    <h2>What to know, big picture</h2>
    <ul>
      <li><strong><!-- Bold lead, a few words. --></strong> <!-- One or two sentences: a risk, a limitation or a decision owed. --></li>
      <li><strong><!-- Bold lead. --></strong> <!-- One or two sentences. --></li>
      <li><strong><!-- Bold lead. --></strong> <!-- One or two sentences. --></li>
    </ul>
  </section>

  <section class="card span">
    <h2>Progress</h2>
    <div class="progress">
      <div>
        <div class="num"><!-- done of pieces, for the task --></div>
        <div class="meter"><span style="width:0%"></span></div>
        <div class="small"><!-- The task's pieces, which are merged, which this PR delivers, the percent with this PR counted and the arithmetic. --></div>
      </div>
      <div>
        <div class="num"><!-- done of live decisions, for the plan --></div>
        <div class="meter"><span style="width:0%"></span></div>
        <div class="small"><!-- The plan: decisions done, partial (counted as half and shown as not done too), parked, rejected excluded, and the arithmetic. --></div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
